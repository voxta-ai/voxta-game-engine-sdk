name: Unity package CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/unity-package-ci.yml'
      - 'Tools/CI/**'
      - 'Tools/ProtocolGenerator/**'
      - 'unity/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/unity-package-ci.yml'
      - 'Tools/CI/**'
      - 'Tools/ProtocolGenerator/**'
      - 'unity/**'
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: unity-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voxta-model-update-notice:
    name: Voxta.Model NuGet update notice
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Check NuGet for a newer Voxta.Model package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pinned = Get-Content -Raw Tools/ProtocolGenerator/pinned-model.json | ConvertFrom-Json
          $packageId = $pinned.packageId.ToLowerInvariant()
          try {
            $index = Invoke-RestMethod -Uri "https://api.nuget.org/v3-flatcontainer/$packageId/index.json"
            $latestVersion = $index.versions[-1]
          }
          catch {
            Write-Output "::warning title=Voxta.Model NuGet check unavailable::Could not query NuGet for updates: $($_.Exception.Message)"
            exit 0
          }
          if ($pinned.packageVersion -eq $latestVersion) {
            Write-Output "Voxta.Model is current at $latestVersion."
            exit 0
          }
          Write-Output "::warning title=Voxta.Model update available::Pinned $($pinned.packageVersion); NuGet latest is $latestVersion. Review and intentionally vendor the new model DLL."
  unity-package:
    name: Unity tests, package validation, and desktop builds
    runs-on: ubuntu-22.04
    env:
      UNITY_VERSION: 2022.3.62f3
      UNITY_WINDOWS_MONO_IMAGE: unityci/editor:ubuntu-2022.3.62f3-windows-mono-3.2.2
      UNITY_LINUX_IL2CPP_IMAGE: unityci/editor:ubuntu-2022.3.62f3-linux-il2cpp-3.2.2
      VALIDATION_PROJECT: .ci/UnityPackageValidation
      # The package manifest still uses a Git dependency. The repository is not
      # anonymously readable on hosted runners, so UPM receives this job's
      # short-lived, read-only token rather than attempting an interactive prompt.
      PACKAGE_GIT_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
      # Defined once here, inherited by all Game-CI steps below
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          # unity-builder's default Semantic versioning reads Git history.
          # A full checkout prevents its internal git fetch --unshallow call.
          fetch-depth: 0
          persist-credentials: false

      - name: Create a clean Git-installed validation project
        shell: pwsh
        run: |
          $revision = '${{ github.event.pull_request.head.sha || github.sha }}'
          ./Tools/CI/Initialize-UnityPackageValidationProject.ps1 -ProjectPath $env:VALIDATION_PROJECT -Revision $revision -PackageGitUrl $env:PACKAGE_GIT_URL
      - name: Resolve the package and import Basic Chat Integration
        uses: game-ci/unity-builder@v4
        with:
          customImage: ${{ env.UNITY_WINDOWS_MONO_IMAGE }}
          projectPath: ${{ env.VALIDATION_PROJECT }}
          targetPlatform: StandaloneWindows64
          buildMethod: Voxta.CI.UnityPackageValidationBuild.ImportBasicIntegrationSample
          allowDirtyBuild: true

      - name: Run package Edit and Play Mode tests
        uses: game-ci/unity-test-runner@v4.3.1
        with:
          customImage: ${{ env.UNITY_WINDOWS_MONO_IMAGE }}
          projectPath: ${{ env.VALIDATION_PROJECT }}
          testMode: all
          artifactsPath: artifacts/test-results

      - name: Build Basic Chat Integration for Windows Mono
        uses: game-ci/unity-builder@v4
        with:
          customImage: ${{ env.UNITY_WINDOWS_MONO_IMAGE }}
          projectPath: ${{ env.VALIDATION_PROJECT }}
          targetPlatform: StandaloneWindows64
          buildMethod: Voxta.CI.UnityPackageValidationBuild.BuildMonoWindows64
          allowDirtyBuild: true

      - name: Reclaim Windows Mono image space before the IL2CPP build
        shell: bash
        run: |
          set -euo pipefail
          docker image rm "$UNITY_WINDOWS_MONO_IMAGE"
          docker system df
      - name: Build Basic Chat Integration for Linux IL2CPP
        uses: game-ci/unity-builder@v4
        with:
          customImage: ${{ env.UNITY_LINUX_IL2CPP_IMAGE }}
          projectPath: ${{ env.VALIDATION_PROJECT }}
          targetPlatform: StandaloneLinux64
          buildMethod: Voxta.CI.UnityPackageValidationBuild.BuildIl2CppLinux64
          allowDirtyBuild: true

      - name: Upload Unity results and players
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: unity-package-ci-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            artifacts/test-results
            ${{ env.VALIDATION_PROJECT }}/Builds
            ${{ env.VALIDATION_PROJECT }}/Logs
